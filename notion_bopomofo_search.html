<h2 class="sr-only">Notion 注音搜尋工具 — 設定與搜尋介面</h2>

<div class="app">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('search')" id="tab-search"><i class="ti ti-search" aria-hidden="true"></i> 搜尋</button>
    <button class="tab" onclick="switchTab('settings')" id="tab-settings"><i class="ti ti-settings" aria-hidden="true"></i> 設定</button>
  </div>

  <!-- 搜尋面板 -->
  <div class="panel active" id="panel-search">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="輸入搜尋文字，例如：大業路" oninput="onSearchInput()" onkeydown="if(event.key==='Enter') doSearch()" />
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()" aria-label="語音輸入">
        <i class="ti ti-microphone" style="font-size:18px;" id="mic-icon"></i>
      </button>
      <button class="btn primary" onclick="doSearch()"><i class="ti ti-search" aria-hidden="true"></i> 搜尋</button>
    </div>
    <div class="bopo-preview" id="bopo-preview"></div>
    <div id="search-status"></div>
    <div id="results-container">
      <div class="empty" id="empty-msg"><i class="ti ti-mood-search" style="font-size:32px; display:block; margin-bottom:8px; color:var(--color-text-tertiary)"></i>輸入關鍵字開始搜尋</div>
    </div>
  </div>

  <!-- 設定面板 -->
  <div class="panel" id="panel-settings">
    <div class="card">
      <div class="section-title"><i class="ti ti-key" aria-hidden="true"></i> Notion 連線設定</div>
      <div class="row">
        <label>Notion API Key（Integration Token）</label>
        <input type="password" id="cfg-apikey" placeholder="secret_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" />
        <div class="hint">前往 notion.so/my-integrations 取得</div>
      </div>
      <div class="row">
        <label>Database ID</label>
        <input type="text" id="cfg-dbid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
        <div class="hint">從 Notion DB 頁面 URL 複製</div>
      </div>
      <div class="btn-row">
        <button class="btn primary" onclick="saveAndTest()"><i class="ti ti-plug" aria-hidden="true"></i> 儲存並測試連線</button>
        <span id="conn-status"></span>
      </div>
    </div>

    <div class="card">
      <div class="section-title"><i class="ti ti-columns" aria-hidden="true"></i> 搜尋欄位設定</div>
      <div id="field-list"></div>
      <button class="btn" onclick="addField()" style="margin-top:8px"><i class="ti ti-plus" aria-hidden="true"></i> 新增欄位</button>
      <div class="hint" style="margin-top:8px">設定要用注音比對的 Notion 欄位名稱（需與 Notion 欄位名完全相同）</div>
    </div>

    <div class="card">
      <div class="section-title"><i class="ti ti-eye" aria-hidden="true"></i> 結果顯示欄位</div>
      <div class="row">
        <label>標題欄位（顯示為搜尋結果主標題）</label>
        <input type="text" id="cfg-title-field" placeholder="名稱" />
      </div>
      <div class="row">
        <label>副標題欄位（顯示在標題下方）</label>
        <input type="text" id="cfg-sub-field" placeholder="地址" />
      </div>
      <div class="btn-row">
        <button class="btn primary" onclick="saveSettings()"><i class="ti ti-device-floppy" aria-hidden="true"></i> 儲存設定</button>
        <span id="save-status"></span>
      </div>
    </div>
  </div>
</div>

function toBopomofo(text) {
  let result = '';
  for (let ch of text) {
    if (/[\u4e00-\u9fff]/.test(ch)) {
      const bopo = BOPOMOFO_MAP[ch];
      result += bopo ? bopo[0] : ch;
    } else {
      result += ch.toLowerCase();
    }
  }
  return result;
}

function bopoScore(query, text) {
  const qBopo = toBopomofo(query);
  const tBopo = toBopomofo(text);
  if (tBopo.includes(qBopo)) return 1.0;
  const q = qBopo.replace(/[^\u3100-\u312f\u02ca\u02c7\u02cb\u02d9a-z0-9]/gi, '');
  const t = tBopo.replace(/[^\u3100-\u312f\u02ca\u02c7\u02cb\u02d9a-z0-9]/gi, '');
  if (t.includes(q)) return 0.9;
  if (text.toLowerCase().includes(query.toLowerCase())) return 0.8;
  return 0;
}

let cfg = {
  apiKey: '', dbId: '',
  searchFields: ['名稱', '地址', '備註'],
  titleField: '名稱',
  subField: '地址'
};

function loadCfg() {
  try {
    const s = localStorage.getItem('notion_bopo_cfg');
    if (s) cfg = { ...cfg, ...JSON.parse(s) };
  } catch(e) {}
  document.getElementById('cfg-apikey').value = cfg.apiKey;
  document.getElementById('cfg-dbid').value = cfg.dbId;
  document.getElementById('cfg-title-field').value = cfg.titleField;
  document.getElementById('cfg-sub-field').value = cfg.subField;
  renderFieldList();
}

function saveCfg() {
  cfg.apiKey = document.getElementById('cfg-apikey').value.trim();
  cfg.dbId = document.getElementById('cfg-dbid').value.trim().replace(/[^a-zA-Z0-9]/g, '');
  cfg.titleField = document.getElementById('cfg-title-field').value.trim();
  cfg.subField = document.getElementById('cfg-sub-field').value.trim();
  try { localStorage.setItem('notion_bopo_cfg', JSON.stringify(cfg)); } catch(e) {}
}

function renderFieldList() {
  const el = document.getElementById('field-list');
  el.innerHTML = cfg.searchFields.map((f, i) => `
    <div class="field-row">
      <input type="text" value="${f}" onchange="cfg.searchFields[${i}]=this.value" placeholder="欄位名稱" />
      <span class="field-tag">注音比對</span>
      <button class="btn" onclick="removeField(${i})" style="padding:4px 10px; font-size:13px"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>`).join('');
}

function addField() {
  cfg.searchFields.push('');
  renderFieldList();
}

function removeField(i) {
  cfg.searchFields.splice(i, 1);
  renderFieldList();
}

function saveSettings() {
  saveCfg();
  const el = document.getElementById('save-status');
  el.innerHTML = '<span class="saved-indicator"><i class="ti ti-check"></i> 已儲存</span>';
  setTimeout(() => el.innerHTML = '', 2000);
}

async function saveAndTest() {
  saveCfg();
  const el = document.getElementById('conn-status');
  el.innerHTML = '<span class="status info"><span class="spinner"></span>連線測試中...</span>';
  try {
    const r = await fetch(`https://api.notion.com/v1/databases/${cfg.dbId}`, {
      headers: { 'Authorization': `Bearer ${cfg.apiKey}`, 'Notion-Version': '2022-06-28' }
    });
    if (r.ok) {
      const d = await r.json();
      el.innerHTML = `<span class="status ok"><i class="ti ti-check"></i> 連線成功：${d.title?.[0]?.plain_text || 'DB'}</span>`;
    } else {
      const d = await r.json();
      el.innerHTML = `<span class="status err"><i class="ti ti-x"></i> ${d.message || '連線失敗'}</span>`;
    }
  } catch(e) {
    el.innerHTML = `<span class="status err"><i class="ti ti-x"></i> 網路錯誤：${e.message}</span>`;
  }
}

function getPropValue(prop) {
  if (!prop) return '';
  if (prop.type === 'title') return prop.title?.map(t => t.plain_text).join('') || '';
  if (prop.type === 'rich_text') return prop.rich_text?.map(t => t.plain_text).join('') || '';
  if (prop.type === 'select') return prop.select?.name || '';
  if (prop.type === 'multi_select') return prop.multi_select?.map(s => s.name).join(' ') || '';
  if (prop.type === 'url') return prop.url || '';
  if (prop.type === 'email') return prop.email || '';
  if (prop.type === 'phone_number') return prop.phone_number || '';
  if (prop.type === 'number') return String(prop.number ?? '');
  return '';
}

async function fetchAllPages(query) {
  let pages = [], cursor = undefined;
  while (true) {
    const body = { page_size: 100 };
    if (cursor) body.start_cursor = cursor;
    const r = await fetch(`https://api.notion.com/v1/databases/${cfg.dbId}/query`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${cfg.apiKey}`,
        'Notion-Version': '2022-06-28',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error((await r.json()).message || '查詢失敗');
    const d = await r.json();
    pages = pages.concat(d.results);
    if (!d.has_more) break;
    cursor = d.next_cursor;
  }
  return pages;
}

function onSearchInput() {
  const q = document.getElementById('search-input').value.trim();
  if (q) {
    document.getElementById('bopo-preview').textContent = `注音：${toBopomofo(q)}`;
  } else {
    document.getElementById('bopo-preview').textContent = '';
  }
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  if (!cfg.apiKey || !cfg.dbId) {
    document.getElementById('search-status').innerHTML = '<div class="status err" style="margin-bottom:12px"><i class="ti ti-settings"></i> 請先在「設定」頁面填入 API Key 與 Database ID</div>';
    return;
  }
  document.getElementById('search-status').innerHTML = '<div class="status info" style="margin-bottom:12px"><span class="spinner"></span>搜尋中...</div>';
  document.getElementById('results-container').innerHTML = '';
  try {
    const pages = await fetchAllPages(q);
    const results = [];
    for (const page of pages) {
      let bestScore = 0;
      let matchedFields = [];
      for (const fieldName of cfg.searchFields) {
        const prop = page.properties[fieldName];
        if (!prop) continue;
        const val = getPropValue(prop);
        if (!val) continue;
        const score = bopoScore(q, val);
        if (score > 0) {
          if (score > bestScore) bestScore = score;
          matchedFields.push({ field: fieldName, val, score });
        }
      }
      if (bestScore > 0) results.push({ page, score: bestScore, matchedFields });
    }
    results.sort((a, b) => b.score - a.score);
    document.getElementById('search-status').innerHTML = '';
    if (results.length === 0) {
      document.getElementById('results-container').innerHTML = `<div class="empty"><i class="ti ti-search-off" style="font-size:32px;display:block;margin-bottom:8px;color:var(--color-text-tertiary)"></i>找不到「${q}」的相關結果</div>`;
      return;
    }
    const qBopo = toBopomofo(q);
    document.getElementById('results-container').innerHTML = results.map(({ page, matchedFields }) => {
      const props = page.properties;
      const title = getPropValue(props[cfg.titleField]) || Object.values(props).map(getPropValue).find(v => v) || '（無標題）';
      const sub = cfg.subField && props[cfg.subField] ? getPropValue(props[cfg.subField]) : '';
      const badges = matchedFields.map(m => `<span class="match-badge">${m.field}</span>`).join('');
      const url = page.url;
      return `<div class="result-card" onclick="openLink('${url}')">
        <div class="result-title">${title}</div>
        ${sub ? `<div class="result-sub">${sub}</div>` : ''}
        <div class="result-match">${badges}</div>
        <div class="bopo-preview">查詢注音：${qBopo}</div>
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('search-status').innerHTML = `<div class="status err" style="margin-bottom:12px"><i class="ti ti-x"></i> 錯誤：${e.message}</div>`;
  }
}

let recognition = null, isRecording = false;
function toggleMic() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { alert('此瀏覽器不支援語音輸入，請使用 Chrome'); return; }
  if (isRecording) {
    recognition.stop(); return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-TW';
  recognition.interimResults = true;
  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('mic-icon').className = 'ti ti-microphone-off';
  };
  recognition.onresult = e => {
    const t = Array.from(e.results).map(r => r[0].transcript).join('');
    document.getElementById('search-input').value = t;
    onSearchInput();
  };
  recognition.onend = () => {
    isRecording = false;
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-icon').className = 'ti ti-microphone';
    const v = document.getElementById('search-input').value.trim();
    if (v) doSearch();
  };
  recognition.start();
}

function switchTab(t) {
  ['search', 'settings'].forEach(id => {
    document.getElementById('panel-' + id).classList.toggle('active', id === t);
    document.getElementById('tab-' + id).classList.toggle('active', id === t);
  });
}

loadCfg();
